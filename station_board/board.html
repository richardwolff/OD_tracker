<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Board</title>
<script>
// Set before first paint, as OD Tracker does: ?touch=1 forces finger sizing on,
// ?touch=0 off. ?embed=1 means OD Tracker is showing this page inside itself and
// draws incoming messages on its own, so this page leaves them out.
(function () {
  var q = new URLSearchParams(location.search);
  var f = q.get("touch");
  var on = f === "1" ? true : f === "0" ? false : matchMedia("(pointer: coarse)").matches;
  if (on) document.documentElement.classList.add("touch");
  if (q.get("embed") === "1") document.documentElement.classList.add("embed");
  var theme = q.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
})();
</script>
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface:        #fcfcfb;
  --surface-sunk:   #f2f1ed;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --border:         rgba(11,11,11,0.10);
  --accent:         #2a78d6;
  --good:           #0ca30c;
  --critical:       #d03b3b;
  --request:        #fab219;
  --shadow:         0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-sunk: #131312;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --border: rgba(255,255,255,0.10); --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-sunk: #131312;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --border: rgba(255,255,255,0.10); --accent: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
/* inside OD Tracker the overlay's own bar names the page, so this one goes */
html.embed header { display: none; }
h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
h1 span { color: var(--text-muted); font-weight: 400; }
.spacer { flex: 1; }
.conn { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; }
.dot.on { background: var(--good); }
.dot.off { background: var(--critical); }

button {
  font: inherit; font-size: 13.5px; font-weight: 550;
  color: var(--text-primary); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
button:hover { background: var(--surface-sunk); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; }
button.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding: 16px 18px 28px; max-width: 1100px; margin: 0 auto; }
h2 {
  font-size: 11.5px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px;
}
section + section { margin-top: 20px; }

/* ---------- this station ---------- */
.here {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px;
}
.here .nobody { color: var(--text-secondary); flex: 1; }
.person-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: color-mix(in srgb, var(--good) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
  border-radius: 999px; padding: 4px 6px 4px 12px; font-weight: 600;
}
.person-chip .since { font-weight: 400; color: var(--text-secondary); font-size: 12.5px; }
.person-chip button { border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }

/* ---------- all stations ---------- */
.stations {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.station {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px;
}
.station.mine { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.st-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.st-name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-state { font-size: 12px; color: var(--text-muted); }
.st-empty { color: var(--text-muted); font-size: 13.5px; padding: 6px 0 2px; }
.st-person {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-top: 1px solid var(--border);
}
.st-head + .st-person { border-top: 0; }
.st-person .who { flex: 1; min-width: 0; }
.st-person .who b { font-weight: 600; }
.st-person .who small { display: block; color: var(--text-muted); font-size: 12px; }

.empty-board {
  text-align: center; color: var(--text-secondary);
  padding: 40px 16px; border: 1px dashed var(--border); border-radius: 12px;
}

/* ---------- sign in ---------- */
.signin {
  max-width: 380px; margin: 24px auto 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 18px;
}
.signin .add-row { margin-top: 12px; }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--border); border-radius: 14px; padding: 0;
  background: var(--surface); color: var(--text-primary);
  box-shadow: 0 20px 60px rgba(0,0,0,.28);
  width: min(520px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
}
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-body { padding: 18px; }
.dlg-title { font-size: 16px; font-weight: 650; margin: 0 0 2px; }
.dlg-sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 14px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.label {
  display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px;
}
.err { color: var(--critical); font-size: 12.5px; margin-top: 8px; }

/* the name grid: the whole point of log-on is one tap on a big target */
.names { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.names button { text-align: left; padding: 10px 12px; font-size: 15px; white-space: normal; }
.names button small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-muted); }
.names button.picked { background: var(--accent); color: #fff; border-color: transparent; }
.names button.picked small { color: rgba(255,255,255,.8); }
.names .x { color: var(--critical); }
.add-row { display: flex; gap: 8px; margin-top: 10px; }
input[type="text"], input[type="password"], textarea {
  width: 100%; font: inherit; font-size: 15px; color: var(--text-primary);
  background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
}
input[type="text"]:focus, input[type="password"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 64px; }

/* ---------- chat ---------- */
/* The dialog is a column whose thread takes whatever height is left, so on the
   Pi's 480px panel the compose box never falls off the bottom. */
#chatDlg[open] { display: flex; flex-direction: column; }
#chatDlg:focus { outline: none; }
/* Content-sized, shrinking only when the screen is short: a zero basis (flex: 1)
   collapses the whole body in WebKit — the Mac app and Safari — leaving just
   the compose row showing. */
#chatDlg .dlg-body { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; }
.chat-from { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.chat-from b { color: var(--text-primary); }
.thread {
  flex: 0 1 auto; min-height: 60px; max-height: 260px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px; margin-bottom: 10px;
  background: var(--page); border: 1px solid var(--border); border-radius: 10px;
}
.thread .none { margin: auto; color: var(--text-muted); font-size: 13px; text-align: center; }
.bubble { max-width: 80%; padding: 6px 10px; border-radius: 12px; font-size: 14.5px; line-height: 1.35;
          white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-sunk); align-self: flex-start; }
.bubble.mine { background: var(--accent); color: #fff; align-self: flex-end; }
.bubble time { display: block; font-size: 10.5px; opacity: .7; margin-top: 2px; }
.bubble .who { display: block; font-size: 11.5px; font-weight: 650; opacity: .85; }
.bubble .quote { display: block; font-size: 12px; opacity: .75; border-left: 2px solid currentColor;
                 padding-left: 6px; margin-bottom: 4px; }
.st-msg { font-size: 12.5px; padding: 3px 8px; margin: -3px -6px -3px 0; }
.compose { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
.compose textarea { min-height: 44px; height: 44px; }
.compose button { flex: none; }
.compose .attach { padding: 6px 9px; font-size: 16px; }
.attached { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.attached button { font-size: 12px; padding: 2px 8px; }
/* a zip in a message: its name, and what can be done with it */
.file { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; }
.file .fname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0; }
.file button { font-size: 12px; padding: 3px 9px; }
.bubble.mine .file button { color: var(--text-primary); }
html.touch .file button { min-height: 34px; padding: 4px 10px; }

/* ---------- incoming requests, upper right ---------- */
/* just under the header, so a message never covers "I'm …" or Sign out */
.msg-stack {
  position: fixed; top: 56px; right: 10px; z-index: 50;
  display: flex; flex-direction: column; gap: 8px;
  width: min(380px, calc(100vw - 20px));
  pointer-events: none;
}
html.embed .msg-stack { display: none; }
.msg {
  pointer-events: auto;
  background: var(--surface); color: var(--text-primary);
  border: 1px solid var(--border); border-left: 4px solid var(--request);
  border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.22);
  padding: 8px 10px 8px 12px; animation: msg-in .25s ease-out;
}
.msg-head { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; }
.msg-head b { color: var(--text-primary); }
.msg-head span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-head time { flex: none; white-space: nowrap; }
.msg-head time { margin-left: auto; color: var(--text-muted); }
.msg-text { font-size: 15px; line-height: 1.35; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
/* the button sits beside the text, not under it: on the Pi's short panel every
   row a request takes is a row of the header it covers */
.msg-body { display: flex; align-items: center; gap: 10px; }
.msg-body > div { flex: 1; min-width: 0; }
.msg-actions { flex: none; display: flex; flex-direction: column; gap: 6px; }
@keyframes msg-in { from { opacity: 0; transform: translateY(-8px); } }

/* ---------- touch ---------- */
html.touch * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html.touch button { min-height: 44px; padding: 10px 16px; font-size: 15px; }
html.touch .person-chip button { min-height: 36px; padding: 6px 12px; }
html.touch .st-msg { min-height: 34px; padding: 4px 10px; font-size: 13.5px; }
html.touch .names button { min-height: 56px; font-size: 16px; }
html.touch input[type="text"], html.touch input[type="password"], html.touch textarea { font-size: 17px; padding: 11px 12px; }
html.touch .msg-actions button { min-height: 40px; }
/* the Pi's 800x480 panel: claw back vertical room */
@media (max-height: 520px) {
  .thread { max-height: none; }
  header { padding: 8px 14px; }
  main { padding: 10px 14px 20px; }
  section + section { margin-top: 14px; }
  .dlg-body { padding: 14px 16px; }
}
</style>
</head>
<body>

<header>
  <h1 id="title">Station Board</h1>
  <div class="spacer"></div>
  <button class="ghost" id="meBtn" hidden title="Who this device is for: their messages pop up here">I'm…</button>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
  <button class="ghost" id="signOut" hidden>Sign out</button>
</header>

<main>
  <!-- shown instead of the board while the server wants a password -->
  <form class="signin" id="signin" hidden>
    <p class="dlg-title">Station Board</p>
    <p class="dlg-sub" id="signinSub" style="margin:0">Enter the lab's board password.</p>
    <div class="add-row" id="signinRow">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password">
      <button class="primary" type="submit" id="pwGo">Sign in</button>
    </div>
    <div class="err" id="pwErr"></div>
  </form>

  <div id="boardBody">
  <section id="hereSec" hidden>
    <h2 id="hereTitle">At this station</h2>
    <div class="here" id="here"></div>
  </section>

  <section>
    <h2>Stations</h2>
    <div class="stations" id="stations"></div>
    <div class="empty-board" id="emptyBoard" hidden>
      No stations have checked in yet. A station appears here once OD Tracker
      on it is pointed at this board.
    </div>
  </section>
  </div>
</main>

<div class="msg-stack" id="msgStack" aria-live="polite"></div>

<!-- log on: tap your name -->
<dialog id="logonDlg">
  <div class="dlg-body">
    <p class="dlg-title">Who's here?</p>
    <p class="dlg-sub" id="logonSub">Tap your name to log on.</p>
    <div class="names" id="logonNames"></div>
    <span class="label">Not on the list?</span>
    <div class="add-row">
      <input type="text" id="newName" maxlength="40" placeholder="Your name" autocomplete="off">
      <button class="primary" id="addName">Add &amp; log on</button>
    </div>
    <div class="err" id="logonErr"></div>
    <div class="dlg-actions">
      <button class="ghost" id="editNames">Remove names…</button>
      <div class="spacer"></div>
      <button id="logonCancel">Cancel</button>
    </div>
  </div>
</dialog>

<!-- a conversation between two people: a request, and the replies to it -->
<dialog id="chatDlg" tabindex="-1">
  <div class="dlg-body">
    <p class="dlg-title" id="chatTitle"></p>
    <p class="dlg-sub" id="chatSub"></p>
    <div class="chat-from" id="fromLine"></div>
    <div class="names" id="fromNames" style="margin-bottom:10px"></div>
    <div class="thread" id="thread"></div>
    <div class="compose">
      <button type="button" class="attach" id="attachBtn" title="Attach a project zip">📎</button>
      <textarea id="msgText" maxlength="500" placeholder="Write a message…"></textarea>
      <button class="primary" id="msgSend">Send</button>
    </div>
    <input type="file" id="attachFile" accept=".zip,application/zip,application/x-zip-compressed" hidden>
    <div class="attached" id="attached" hidden></div>
    <div class="err" id="msgErr"></div>
    <div class="dlg-actions" style="margin-top:10px">
      <button id="chatClose">Close</button>
    </div>
  </div>
</dialog>

<!-- who this device is for, when it is not a station -->
<dialog id="meDlg">
  <div class="dlg-body">
    <p class="dlg-title">Who are you?</p>
    <p class="dlg-sub" id="meSub"></p>
    <div class="names" id="meNames"></div>
    <div class="dlg-actions">
      <button class="ghost" id="meNone">Nobody — just looking</button>
      <div class="spacer"></div>
      <button id="meCancel">Cancel</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================
   Station Board — the page the server hands out at /
   ?station=<name>  this screen is that station: it can log people on here
                    and shows the requests sent to them
   ?embed=1         shown inside OD Tracker, which draws messages itself
   ?chat=<a>&as=<b> open straight onto the conversation between a and b
   ?re=<id>         open on a reply to that message left at this station
   ============================================================ */

const Q = new URLSearchParams(location.search);
const STATION = (Q.get("station") || "").trim().slice(0, 40);
const EMBED = Q.get("embed") === "1";
const POLL_MS = 3000;

/* The access key the server hands out for the password. OD Tracker passes its
   own in the fragment (#key=…), which never reaches a server log; it is then
   taken out of the address bar. A browser that signed in keeps it here. */
const KEY_STORE = "station-board.key";
let KEY = "";
{
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("key");
  if (fromHash !== null) {
    KEY = fromHash;
    history.replaceState(null, "", location.pathname + location.search);
  } else {
    try { KEY = localStorage.getItem(KEY_STORE) || ""; } catch (e) { /* storage blocked */ }
  }
}

/* Who this device is for, when it is not a station: a phone or a laptop. Their
   messages pop up here wherever they are logged on, or aren't. */
const ME_STORE = "station-board.me";
let ME = "";
try { ME = localStorage.getItem(ME_STORE) || ""; } catch (e) { /* storage blocked */ }

let board = null;          // last /api/state response
let online = false;
let removing = false;      // the log-on dialog's "Remove names…" mode
let chat = null;           // the open conversation: { to } a person or { station },
                           //   plus re, the station note a reply answers
let chatFrom = null;       //   and who is writing
let pickingFrom = false;   //   while the sender is being chosen
let thread = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const stationsOf = name => (board && board.people.find(p => p.name === name) || {}).stations || [];
/* Rebuild a part of the page only when its content changed. The board is
   re-read every few seconds, and replacing a button between a finger going
   down and coming up loses the tap. Returns whether it did. */
const setHTML = (el, html) => {
  if (el.dataset.html === html) return false;
  el.dataset.html = html;
  el.innerHTML = html;
  return true;
};
const listOf = xs => xs.length <= 1 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

/* ---------- server ---------- */
async function api(path, body) {
  const headers = KEY ? { "X-Board-Key": KEY } : {};
  const r = await fetch(path, body === undefined ? { cache: "no-store", headers } : {
    method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || `server said ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
}

async function refresh() {
  try {
    const q = new URLSearchParams();
    if (STATION) q.set("station", STATION);
    else if (ME) q.set("me", ME);
    board = await api("/api/state?" + q);
    setOnline(true);
    showSignin(false);
    render();
    if ($("chatDlg").open) { updateChatSub(); await loadThread(); }
    openChatFromUrl();
  } catch (err) {
    if (err.status === 401) { setOnline(true); showSignin(true); }
    else setOnline(false);
  }
}

/* ---------- sign in ---------- */
function showSignin(on) {
  const form = $("signin");
  if (on === !form.hidden) return;
  form.hidden = !on;
  $("boardBody").hidden = on;
  $("signOut").hidden = on || !KEY || EMBED;
  if (!on) return;
  board = null;
  $("msgStack").innerHTML = ""; delete $("msgStack").dataset.ids;
  // inside OD Tracker the key comes from its Station settings, so that is where to fix it
  $("signinSub").textContent = EMBED
    ? "This board needs a password. Go back and enter it in Station settings."
    : KEY ? "The board password has changed. Enter the new one." : "Enter the lab's board password.";
  $("signinRow").hidden = EMBED;
  if (!EMBED) $("pw").focus();
}

$("signin").addEventListener("submit", async e => {
  e.preventDefault();
  $("pwGo").disabled = true;
  try {
    const { key } = await api("/api/login", { password: $("pw").value });
    KEY = key;
    try { localStorage.setItem(KEY_STORE, key); } catch (err) { /* this visit only */ }
    $("pw").value = ""; $("pwErr").textContent = "";
    await refresh();
  } catch (err) {
    $("pwErr").textContent = err.status ? err.message : "Can't reach the board server.";
  }
  $("pwGo").disabled = false;
});

$("signOut").onclick = () => {
  KEY = "";
  try { localStorage.removeItem(KEY_STORE); } catch (e) { /* nothing kept */ }
  refresh();
};

function setOnline(on) {
  online = on;
  $("connDot").className = "dot " + (on ? "on" : "off");
  $("connText").textContent = on ? "Live" : "Can't reach the board server";
}

// every change is followed by a fresh read, so all screens agree within a poll
async function act(path, body, errEl) {
  try {
    await api(path, body);
    if (errEl) errEl.textContent = "";
    await refresh();
    return true;
  } catch (err) {
    if (errEl) errEl.textContent = err.message;
    return false;
  }
}

/* ---------- render ---------- */
function render() {
  if (!board) return;
  $("signOut").hidden = !KEY || EMBED;
  $("title").innerHTML = STATION
    ? `Station Board <span>· ${esc(STATION)}</span>` : "Station Board";
  // a station shows everyone logged on at it; only a personal device needs a "me"
  $("meBtn").hidden = !!STATION || EMBED;
  $("meBtn").textContent = ME ? `I'm ${ME}` : "I'm…";

  const mine = board.stations.find(s => s.name === STATION);

  // this station: who's here, and the way on and off
  $("hereSec").hidden = !STATION;
  if (STATION) {
    const here = mine ? mine.people : [];
    const changed = setHTML($("here"), (here.length
      ? here.map(p => `<span class="person-chip">${esc(p.name)}
          <span class="since">since ${clock(p.since)}</span>
          <button data-logoff="${esc(p.name)}">Log off</button></span>`).join("")
      : `<span class="nobody">Nobody is logged on at ${esc(STATION)}.</span>`)
      + `<div class="spacer"></div><button class="primary" id="logonBtn">Log on</button>`);
    if (changed) {
      $("logonBtn").onclick = () => openLogon();
      $("here").querySelectorAll("[data-logoff]").forEach(b => {
        b.onclick = () => act("/api/logoff", { person: b.dataset.logoff, station: STATION });
      });
    }
  }

  // every station; this one first, since it is the one in front of you
  const list = board.stations.slice().sort((a, b) => (b.name === STATION) - (a.name === STATION));
  $("emptyBoard").hidden = list.length > 0;
  const changed = setHTML($("stations"), list.map(s => `
    <div class="station ${s.name === STATION ? "mine" : ""}">
      <div class="st-head">
        <span class="dot ${s.online ? "on" : ""}" title="${s.online ? "Station is on" : "Station not heard from"}"></span>
        <span class="st-name">${esc(s.name)}</span>
        <span class="st-state">${s.name === STATION ? "here" : s.online ? "" : "offline"}</span>
        <button class="ghost st-msg" data-msg-station="${esc(s.name)}" title="Leave a message on this station's screen">Message</button>
      </div>
      ${s.people.length ? s.people.map(p => {
        const also = stationsOf(p.name).filter(x => x !== s.name);
        return `
        <div class="st-person">
          <span class="who"><b>${esc(p.name)}</b><small>here since ${clock(p.since)}${also.length ? ` · also at ${esc(listOf(also))}` : ""}</small></span>
          <button data-msg="${esc(p.name)}">Request</button>
        </div>`; }).join("") : `<div class="st-empty">Nobody here</div>`}
    </div>`).join(""));
  if (changed) {
    $("stations").querySelectorAll("[data-msg]").forEach(b => { b.onclick = () => openChat({ to: b.dataset.msg }); });
    $("stations").querySelectorAll("[data-msg-station]").forEach(b => { b.onclick = () => openChat({ station: b.dataset.msgStation }); });
  }

  renderMessages();
  if ($("logonDlg").open) renderLogonNames();
}

/* Incoming messages, upper right: for everyone logged on at this station, or
   for whoever this device is. Inside OD Tracker the parent page draws these
   (it is what fills the screen), so here they only show when standalone. */
function renderMessages() {
  const stack = $("msgStack");
  const msgs = EMBED || !board.messages ? [] : board.messages;
  const ids = msgs.map(m => m.id).join();
  if (stack.dataset.ids === ids) return;      // unchanged: leave the animation alone
  stack.dataset.ids = ids;
  stack.innerHTML = msgs.map(m => `
    <div class="msg" role="status">
      <div class="msg-body">
        <div><div class="msg-head"><span><b>${esc(m.from)}</b> → ${esc(m.to || m.toStation)}</span><time>${clock(m.at)}</time></div>
          ${m.text ? `<div class="msg-text">${esc(m.text)}</div>` : ""}
          ${m.file ? fileHTML(m.file, m.id) : ""}</div>
        <div class="msg-actions">
          <button data-ack="${esc(m.id)}">Got it</button>
          <button data-reply="${esc(m.id)}">Reply</button>
        </div>
      </div>
    </div>`).join("");
  stack.querySelectorAll("[data-ack]").forEach(b => {
    b.onclick = () => act("/api/messages/ack", { id: b.dataset.ack });
  });
  // replying is answering: the server marks the request done when the reply lands
  stack.querySelectorAll("[data-reply]").forEach(b => {
    const m = msgs.find(x => x.id === b.dataset.reply);
    b.onclick = () => replyTo(m);
  });
}

/* ---------- log on ---------- */
function openLogon(why = "") {
  removing = false;
  $("logonErr").textContent = "";
  $("newName").value = "";
  $("logonSub").textContent = why || `Tap your name to log on at ${STATION}.`;
  renderLogonNames();
  $("logonDlg").showModal();
}

function renderLogonNames() {
  const people = board ? board.people : [];
  $("editNames").textContent = removing ? "Done removing" : "Remove names…";
  const changed = setHTML($("logonNames"), people.length ? people.map(p => {
    // logging on here adds this station; it doesn't take them off the others
    const here = p.stations.includes(STATION);
    const elsewhere = p.stations.filter(x => x !== STATION);
    const where = here ? "already here" : elsewhere.length ? `also at ${esc(listOf(elsewhere))}` : "";
    return `<button data-name="${esc(p.name)}" ${here && !removing ? "disabled" : ""}>
      ${removing ? `<span class="x">✕</span> ` : ""}${esc(p.name)}${where && !removing ? `<small>${where}</small>` : ""}
    </button>`;
  }).join("") : `<p class="dlg-sub" style="grid-column:1/-1;margin:0">No names yet — add yours below.</p>`);
  if (!changed) return;

  $("logonNames").querySelectorAll("[data-name]").forEach(b => {
    b.onclick = async () => {
      const name = b.dataset.name;
      if (removing) { await act("/api/people/remove", { name }, $("logonErr")); return; }
      if (await act("/api/logon", { person: name, station: STATION }, $("logonErr"))) loggedOn(name);
    };
  });
}

// a log-on asked for by a message goes straight on to that message, from them
function loggedOn(name) {
  $("logonDlg").close();
  const target = resumeChatWith;
  resumeChatWith = null;
  if (target && target.to !== name) openChat(target, name);
}
$("logonDlg").addEventListener("cancel", () => { resumeChatWith = null; });

$("editNames").onclick = () => { removing = !removing; renderLogonNames(); };
$("logonCancel").onclick = () => { resumeChatWith = null; $("logonDlg").close(); };
$("addName").onclick = async () => {
  const name = $("newName").value.trim();
  if (!name) { $("logonErr").textContent = "Type your name first."; $("newName").focus(); return; }
  if (await act("/api/logon", { person: name, station: STATION }, $("logonErr"))) loggedOn(name);
};
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") $("addName").click(); });

/* ---------- conversations ----------
   One dialog for every kind of message: a request to a person and the replies
   to it, or a note left at a station. It shows what has been said so far and a
   box to write in. Nobody is asked who is writing: it is whoever is logged on
   here (see assumedSender), and a Reply is from the person the message was for
   or, for a note left at this station, from whoever is here. Change can still
   pick anyone on the list. */

/* Who a new message is from, without asking: at a station, whoever logged on
   there most recently; on a phone or laptop, whoever it says it is. */
function assumedSender(to) {
  if (STATION) {
    const mine = board.stations.find(s => s.name === STATION);
    const here = mine ? mine.people.map(p => p.name).filter(n => n !== to) : [];
    return here.length ? here[here.length - 1] : null;   // the server sends them oldest first
  }
  return ME && ME !== to ? ME : null;
}

/* With nobody to send as, the way forward is to say who you are — log on here,
   or tell this device — and the message carries on from there. */
let resumeChatWith = null;

function openChat(target, from = null) {
  from = from || assumedSender(target.to);
  if (!from) {
    resumeChatWith = target;
    const what = target.to ? `send ${target.to} a message` : `leave a message at ${target.station}`;
    if (STATION) openLogon(`Log on to ${what}.`);
    else openMe(`Tell this device who you are to ${what}.`);
    return;
  }
  chat = target;
  chatFrom = from;
  pickingFrom = false;
  thread = [];
  $("msgText").value = "";
  $("msgErr").textContent = "";
  renderChat();
  $("chatDlg").showModal();
  // a keyboard user can type straight away; on a touch screen nothing takes
  // focus, so a phone's keyboard doesn't open over the conversation
  if (document.documentElement.classList.contains("touch")) $("chatDlg").focus();
  else $("msgText").focus();
  loadThread();
}

async function loadThread() {
  if (!chat || !chatFrom) { thread = []; renderThread(); return; }
  const asked = chat, as = chatFrom;
  const q = chat.station ? `station=${encodeURIComponent(chat.station)}`
                         : `a=${encodeURIComponent(chat.to)}&b=${encodeURIComponent(chatFrom)}`;
  try {
    const { messages } = await api(`/api/thread?${q}`);
    if (asked !== chat || as !== chatFrom) return;   // switched conversation or sender meanwhile
    // only redraw (and jump to the bottom) when something arrived
    if (messages.map(m => m.id).join() === thread.map(m => m.id).join()) return;
    thread = messages;
    renderThread();
  } catch (err) { /* the next poll tries again */ }
}

function updateChatSub() {
  if (chat.station) {
    $("chatSub").textContent = `Shows on the ${chat.station} screen until someone there answers it.`;
    return;
  }
  const where = stationsOf(chat.to);
  $("chatSub").textContent = (chat.re ? `Replying to the message left at ${chat.re.toStation}. ` : "")
    + (where.length ? `${chat.to} is logged on at ${listOf(where)} — it pops up there.`
                    : `${chat.to} isn't logged on — they'll see it when they next log on.`);
}

function renderChat() {
  $("chatTitle").textContent = chat.station ? `Message for ${chat.station}` : chat.to;
  updateChatSub();

  // the sender: assumed, shown on one line, and only listed out if Change is tapped
  $("fromLine").hidden = pickingFrom;
  $("fromLine").innerHTML = chatFrom
    ? `From <b>${esc(chatFrom)}</b> <button class="ghost" id="fromChange" type="button">Change</button>` : "";
  if (chatFrom) $("fromChange").onclick = () => { pickingFrom = true; renderChat(); };

  $("fromNames").hidden = !pickingFrom;
  if (pickingFrom) {
    const mine = board.stations.find(s => s.name === STATION);
    const here = mine ? mine.people.map(p => p.name) : [];
    // people here first, then this device's owner: they are almost always the sender
    const rank = n => (here.includes(n) ? 2 : 0) + (n === ME ? 1 : 0);
    const names = board.people.map(p => p.name).filter(n => n !== chat.to).sort((a, b) => rank(b) - rank(a));
    $("fromNames").innerHTML = `<span class="label" style="grid-column:1/-1;margin:0">Send as</span>`
      + (names.length ? names.map(n => {
          const at = stationsOf(n);
          const note = here.includes(n) ? "at this station" : at.length ? `at ${esc(listOf(at))}` : "";
          return `<button type="button" data-from="${esc(n)}" class="${n === chatFrom ? "picked" : ""}">
            ${esc(n)}${note ? `<small>${note}</small>` : ""}</button>`;
        }).join("")
        : `<p class="dlg-sub" style="grid-column:1/-1;margin:0">Add your name by logging on at a station first.</p>`);
    $("fromNames").querySelectorAll("[data-from]").forEach(b => {
      b.onclick = () => { chatFrom = b.dataset.from; pickingFrom = false; thread = []; renderChat(); loadThread(); };
    });
  }
  renderThread();
}

/* A reply to a note left at a station carries a copy of it, shown above the
   reply so the conversation still makes sense later. */
const quoteHTML = re => `<span class="quote">${esc(re.station)}: ${esc(re.text)}</span>`;

function renderThread() {
  const box = $("thread");
  box.hidden = pickingFrom;
  let html;
  if (chat.station) {
    // many people leave messages at a station, so each one is signed
    html = thread.length
      ? thread.map(m => `<div class="bubble ${m.from === chatFrom ? "mine" : ""}"><b class="who">${esc(m.from)}</b>${esc(m.text)}${m.file ? fileHTML(m.file, m.id) : ""}<time>${clock(m.at)}${m.ackAt ? " · answered" : ""}</time></div>`).join("")
      : `<p class="none">Nothing has been left at ${esc(chat.station)} lately.</p>`;
  } else {
    // the station message being answered, until the reply carrying it is sent
    const pending = chat.re && !thread.some(m => m.re && m.re.text === chat.re.text)
      ? `<div class="bubble"><b class="who">${esc(chat.re.from)} · left at ${esc(chat.re.toStation)}</b>${esc(chat.re.text)}<time>${clock(chat.re.at)}</time></div>` : "";
    html = thread.map(m => `<div class="bubble ${m.from === chatFrom ? "mine" : ""}">${m.re ? quoteHTML(m.re) : ""}${esc(m.text)}${m.file ? fileHTML(m.file, m.id) : ""}<time>${clock(m.at)}</time></div>`).join("")
      + pending;
    if (!html) html = `<p class="none">${chatFrom ? `No messages between ${esc(chatFrom)} and ${esc(chat.to)} yet.` : ""}</p>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
  $("msgText").disabled = $("msgSend").disabled = pickingFrom;
}

$("chatClose").onclick = () => $("chatDlg").close();
$("chatDlg").addEventListener("close", () => { chat = chatFrom = null; thread = []; });
$("msgSend").onclick = async () => {
  const text = $("msgText").value.trim();
  if (!text && !attachment) { $("msgErr").textContent = "Write a message first."; return; }
  $("msgSend").disabled = true;
  try {
    // the zip goes up first; the message then points at it
    let file;
    if (attachment) {
      $("msgErr").textContent = `Sending ${attachment.name}…`;
      const r = await fetch(`/api/files?name=${encodeURIComponent(attachment.name)}`, {
        method: "POST", body: attachment,
        headers: { ...(KEY ? { "X-Board-Key": KEY } : {}), "Content-Type": "application/zip" }
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `server said ${r.status}`);
      file = { id: data.id };
    }
    const body = chat.station ? { from: chatFrom, toStation: chat.station, text, file }
                              : { from: chatFrom, to: chat.to, text, file, answering: chat.re ? chat.re.id : undefined };
    if (await act("/api/messages", body, $("msgErr"))) {
      $("msgText").value = "";
      setAttachment(null);
      await loadThread();
    }
  } catch (err) {
    $("msgErr").textContent = err.message;
  }
  $("msgSend").disabled = false;
};

/* ---------- attachments ----------
   A project zip, picked from disk with 📎 and sent with the message. One
   carried by a message can be downloaded; inside OD Tracker it can also be
   imported straight in, which OD Tracker does (it holds the projects). */
let attachment = null;
function setAttachment(file) {
  attachment = file;
  $("attachFile").value = "";
  $("attached").hidden = !file;
  $("attached").innerHTML = file
    ? `📎 ${esc(file.name)} · ${fileSize(file.size)} <button type="button" class="ghost" id="unattach">Remove</button>` : "";
  if (file) $("unattach").onclick = () => setAttachment(null);
}
$("attachBtn").onclick = () => $("attachFile").click();
$("attachFile").onchange = () => {
  const f = $("attachFile").files[0];
  if (!f) return;
  if (!/\.zip$/i.test(f.name)) { $("msgErr").textContent = "Only project zips can be sent."; return; }
  if (f.size > 25 * 1024 * 1024) { $("msgErr").textContent = "That file is over the 25 MB limit."; return; }
  $("msgErr").textContent = "";
  setAttachment(f);
};
$("chatDlg").addEventListener("close", () => setAttachment(null));

const fileSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} kB` : `${(n / 1048576).toFixed(1)} MB`;
function fileHTML(f, msgId) {
  return `<span class="file" title="${esc(f.name)}"><span class="fname">📎 ${esc(f.name)} · ${fileSize(f.size)}</span>
    <button type="button" data-dl="${esc(f.id)}" data-name="${esc(f.name)}">Download</button>
    ${EMBED ? `<button type="button" data-imp="${esc(f.id)}" data-msg="${esc(msgId)}" data-name="${esc(f.name)}" data-size="${f.size}">Import</button>` : ""}</span>`;
}

// one listener for every file button, wherever it is drawn
document.addEventListener("click", async e => {
  const dl = e.target.closest("[data-dl]"), imp = e.target.closest("[data-imp]");
  if (dl) {
    // fetched with the key, then saved: a plain link can't carry the key
    try {
      const r = await fetch(`/api/files/${encodeURIComponent(dl.dataset.dl)}`, { headers: KEY ? { "X-Board-Key": KEY } : {} });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `server said ${r.status}`);
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement("a");
      a.href = url; a.download = dl.dataset.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (err) { alertIn(dl, err.message); }
  } else if (imp) {
    parent.postMessage({ type: "station-board:import", msgId: imp.dataset.msg,
      file: { id: imp.dataset.imp, name: imp.dataset.name, size: +imp.dataset.size } }, "*");
  }
});
// a failed download says so beside its button, where the tap was
function alertIn(btn, text) {
  const note = document.createElement("span");
  note.className = "err"; note.style.margin = "0"; note.textContent = text;
  btn.after(note);
  setTimeout(() => note.remove(), 6000);
}
$("msgText").addEventListener("keydown", e => {
  // Enter sends, Shift+Enter starts a new line — for anyone with a keyboard
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("msgSend").click(); }
});

/* Reply, on a message in the corner here or in OD Tracker. A message to a
   person is answered by that person; a message left at a station by whoever
   is logged on at it, and the reply clears it. */
function replyTo(m) {
  if (m.toStation) openChat({ to: m.from, re: m });
  else openChat({ to: m.from }, m.to);
}

/* OD Tracker's Reply button opens the board on a conversation:
   ?chat=<the sender>&as=<who is replying>, or &re=<id> for a message left at
   the station. Done once, on the first good read. */
let chatFromUrlDone = false;
function openChatFromUrl() {
  if (chatFromUrlDone) return;
  chatFromUrlDone = true;
  const to = (Q.get("chat") || "").trim(), as = (Q.get("as") || "").trim(), re = Q.get("re");
  const m = re && (board.messages || []).find(x => x.id === re);
  if (m) replyTo(m);
  else if (to && board.people.some(p => p.name === to)) openChat({ to }, as || null);
}

/* ---------- who this device is for ---------- */
function openMe(why = "") {
  $("meSub").textContent = why || "Messages to you will pop up on this device, as they do at a station you're logged on at. It's remembered here.";
  $("meNames").innerHTML = board.people.length
    ? board.people.map(p => `<button type="button" data-me="${esc(p.name)}" class="${p.name === ME ? "picked" : ""}">${esc(p.name)}</button>`).join("")
    : `<p class="dlg-sub" style="grid-column:1/-1;margin:0">No names yet — log on at a station first.</p>`;
  $("meNames").querySelectorAll("[data-me]").forEach(b => { b.onclick = () => setMe(b.dataset.me); });
  $("meDlg").showModal();
}
function setMe(name) {
  ME = name;
  try { name ? localStorage.setItem(ME_STORE, name) : localStorage.removeItem(ME_STORE); } catch (e) { /* this visit only */ }
  $("meDlg").close();
  refresh();
  const target = resumeChatWith;
  resumeChatWith = null;
  if (target && name && target.to !== name) openChat(target, name);
}
$("meBtn").onclick = () => board && openMe();
$("meNone").onclick = () => setMe("");
$("meCancel").onclick = () => { resumeChatWith = null; $("meDlg").close(); };
$("meDlg").addEventListener("cancel", () => { resumeChatWith = null; });

/* ---------- go ---------- */
refresh();
setInterval(refresh, POLL_MS);
// a screen woken from sleep should not wait out a whole poll to catch up
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
