<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Board</title>
<script>
// Set before first paint, as OD Tracker does: ?touch=1 forces finger sizing on,
// ?touch=0 off. ?embed=1 means OD Tracker is showing this page inside itself and
// draws incoming messages on its own, so this page leaves them out.
(function () {
  var q = new URLSearchParams(location.search);
  var f = q.get("touch");
  var on = f === "1" ? true : f === "0" ? false : matchMedia("(pointer: coarse)").matches;
  if (on) document.documentElement.classList.add("touch");
  if (q.get("embed") === "1") document.documentElement.classList.add("embed");
  var theme = q.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
})();
</script>
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface:        #fcfcfb;
  --surface-sunk:   #f2f1ed;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --border:         rgba(11,11,11,0.10);
  --accent:         #2a78d6;
  --good:           #0ca30c;
  --critical:       #d03b3b;
  --request:        #fab219;
  --shadow:         0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-sunk: #131312;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --border: rgba(255,255,255,0.10); --accent: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-sunk: #131312;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --border: rgba(255,255,255,0.10); --accent: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
/* inside OD Tracker the overlay's own bar names the page, so this one goes */
html.embed header { display: none; }
h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
h1 span { color: var(--text-muted); font-weight: 400; }
.spacer { flex: 1; }
.conn { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; }
.dot.on { background: var(--good); }
.dot.off { background: var(--critical); }

button {
  font: inherit; font-size: 13.5px; font-weight: 550;
  color: var(--text-primary); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
button:hover { background: var(--surface-sunk); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; }
button.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding: 16px 18px 28px; max-width: 1100px; margin: 0 auto; }
h2 {
  font-size: 11.5px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px;
}
section + section { margin-top: 20px; }

/* ---------- this station ---------- */
.here {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px;
}
.here .nobody { color: var(--text-secondary); flex: 1; }
.person-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: color-mix(in srgb, var(--good) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
  border-radius: 999px; padding: 4px 6px 4px 12px; font-weight: 600;
}
.person-chip .since { font-weight: 400; color: var(--text-secondary); font-size: 12.5px; }
.person-chip button { border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }

/* ---------- all stations ---------- */
.stations {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.station {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px;
}
.station.mine { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.st-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.st-name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-state { font-size: 12px; color: var(--text-muted); }
.st-empty { color: var(--text-muted); font-size: 13.5px; padding: 6px 0 2px; }
.st-person {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-top: 1px solid var(--border);
}
.st-head + .st-person { border-top: 0; }
.st-person .who { flex: 1; min-width: 0; }
.st-person .who b { font-weight: 600; }
.st-person .who small { display: block; color: var(--text-muted); font-size: 12px; }

.empty-board {
  text-align: center; color: var(--text-secondary);
  padding: 40px 16px; border: 1px dashed var(--border); border-radius: 12px;
}

/* ---------- sign in ---------- */
.signin {
  max-width: 380px; margin: 24px auto 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 18px;
}
.signin .add-row { margin-top: 12px; }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--border); border-radius: 14px; padding: 0;
  background: var(--surface); color: var(--text-primary);
  box-shadow: 0 20px 60px rgba(0,0,0,.28);
  width: min(520px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
}
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg-body { padding: 18px; }
.dlg-title { font-size: 16px; font-weight: 650; margin: 0 0 2px; }
.dlg-sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 14px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.label {
  display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px;
}
.err { color: var(--critical); font-size: 12.5px; margin-top: 8px; }

/* the name grid: the whole point of log-on is one tap on a big target */
.names { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.names button { text-align: left; padding: 10px 12px; font-size: 15px; white-space: normal; }
.names button small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-muted); }
.names button.picked { background: var(--accent); color: #fff; border-color: transparent; }
.names button.picked small { color: rgba(255,255,255,.8); }
.names .x { color: var(--critical); }
.add-row { display: flex; gap: 8px; margin-top: 10px; }
input[type="text"], input[type="password"], textarea {
  width: 100%; font: inherit; font-size: 15px; color: var(--text-primary);
  background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
}
input[type="text"]:focus, input[type="password"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 64px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { border-radius: 999px; font-size: 13px; }

/* ---------- incoming requests, upper right ---------- */
.msg-stack {
  position: fixed; top: 10px; right: 10px; z-index: 50;
  display: flex; flex-direction: column; gap: 8px;
  width: min(340px, calc(100vw - 20px));
  pointer-events: none;
}
html.embed .msg-stack { display: none; }
.msg {
  pointer-events: auto;
  background: var(--surface); color: var(--text-primary);
  border: 1px solid var(--border); border-left: 4px solid var(--request);
  border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.22);
  padding: 8px 10px 8px 12px; animation: msg-in .25s ease-out;
}
.msg-head { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; }
.msg-head b { color: var(--text-primary); }
.msg-head time { margin-left: auto; color: var(--text-muted); }
.msg-text { font-size: 15px; line-height: 1.35; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
/* the button sits beside the text, not under it: on the Pi's short panel every
   row a request takes is a row of the header it covers */
.msg-body { display: flex; align-items: center; gap: 10px; }
.msg-body > div { flex: 1; min-width: 0; }
.msg-actions { flex: none; }
@keyframes msg-in { from { opacity: 0; transform: translateY(-8px); } }

/* ---------- touch ---------- */
html.touch * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html.touch button { min-height: 44px; padding: 10px 16px; font-size: 15px; }
html.touch .person-chip button { min-height: 36px; padding: 6px 12px; }
html.touch .names button { min-height: 56px; font-size: 16px; }
html.touch .presets button { min-height: 40px; font-size: 14px; }
html.touch input[type="text"], html.touch input[type="password"], html.touch textarea { font-size: 17px; padding: 11px 12px; }
html.touch .msg-actions button { min-height: 40px; }
/* the Pi's 800x480 panel: claw back vertical room */
@media (max-height: 520px) {
  header { padding: 8px 14px; }
  main { padding: 10px 14px 20px; }
  section + section { margin-top: 14px; }
  .dlg-body { padding: 14px 16px; }
}
</style>
</head>
<body>

<header>
  <h1 id="title">Station Board</h1>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
  <button class="ghost" id="signOut" hidden>Sign out</button>
</header>

<main>
  <!-- shown instead of the board while the server wants a password -->
  <form class="signin" id="signin" hidden>
    <p class="dlg-title">Station Board</p>
    <p class="dlg-sub" id="signinSub" style="margin:0">Enter the lab's board password.</p>
    <div class="add-row" id="signinRow">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password">
      <button class="primary" type="submit" id="pwGo">Sign in</button>
    </div>
    <div class="err" id="pwErr"></div>
  </form>

  <div id="boardBody">
  <section id="hereSec" hidden>
    <h2 id="hereTitle">At this station</h2>
    <div class="here" id="here"></div>
  </section>

  <section>
    <h2>Stations</h2>
    <div class="stations" id="stations"></div>
    <div class="empty-board" id="emptyBoard" hidden>
      No stations have checked in yet. A station appears here once OD Tracker
      on it is pointed at this board.
    </div>
  </section>
  </div>
</main>

<div class="msg-stack" id="msgStack" aria-live="polite"></div>

<!-- log on: tap your name -->
<dialog id="logonDlg">
  <div class="dlg-body">
    <p class="dlg-title">Who's here?</p>
    <p class="dlg-sub" id="logonSub">Tap your name to log on.</p>
    <div class="names" id="logonNames"></div>
    <span class="label">Not on the list?</span>
    <div class="add-row">
      <input type="text" id="newName" maxlength="40" placeholder="Your name" autocomplete="off">
      <button class="primary" id="addName">Add &amp; log on</button>
    </div>
    <div class="err" id="logonErr"></div>
    <div class="dlg-actions">
      <button class="ghost" id="editNames">Remove names…</button>
      <div class="spacer"></div>
      <button id="logonCancel">Cancel</button>
    </div>
  </div>
</dialog>

<!-- send a request -->
<dialog id="msgDlg">
  <div class="dlg-body">
    <p class="dlg-title" id="msgTitle">Send a request</p>
    <p class="dlg-sub" id="msgSub"></p>
    <span class="label" style="margin-top:0">From</span>
    <div class="names" id="fromNames"></div>
    <span class="label">Message</span>
    <div class="presets" id="presets"></div>
    <textarea id="msgText" maxlength="500" placeholder="Or write your own…" style="margin-top:8px"></textarea>
    <div class="err" id="msgErr"></div>
    <div class="dlg-actions">
      <button id="msgCancel">Cancel</button>
      <button class="primary" id="msgSend">Send</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
/* ============================================================
   Station Board — the page the server hands out at /
   ?station=<name>  this screen is that station: it can log people on here
                    and shows the requests sent to them
   ?embed=1         shown inside OD Tracker, which draws messages itself
   ============================================================ */

const Q = new URLSearchParams(location.search);
const STATION = (Q.get("station") || "").trim().slice(0, 40);
const EMBED = Q.get("embed") === "1";
const POLL_MS = 3000;

/* The access key the server hands out for the password. OD Tracker passes its
   own in the fragment (#key=…), which never reaches a server log; it is then
   taken out of the address bar. A browser that signed in keeps it here. */
const KEY_STORE = "station-board.key";
let KEY = "";
{
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("key");
  if (fromHash !== null) {
    KEY = fromHash;
    history.replaceState(null, "", location.pathname + location.search);
  } else {
    try { KEY = localStorage.getItem(KEY_STORE) || ""; } catch (e) { /* storage blocked */ }
  }
}

// one-tap requests, so nobody needs a keyboard for the usual asks
const PRESETS = [
  "Can you come over?",
  "I need a hand",
  "Please call me",
  "Your samples are ready",
  "Quick question when you're free"
];

let board = null;          // last /api/state response
let online = false;
let removing = false;      // the log-on dialog's "Remove names…" mode
let msgTo = null;          // who the open request dialog is for
let msgFrom = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

/* ---------- server ---------- */
async function api(path, body) {
  const headers = KEY ? { "X-Board-Key": KEY } : {};
  const r = await fetch(path, body === undefined ? { cache: "no-store", headers } : {
    method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || `server said ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
}

async function refresh() {
  try {
    board = await api("/api/state" + (STATION ? "?station=" + encodeURIComponent(STATION) : ""));
    setOnline(true);
    showSignin(false);
    render();
  } catch (err) {
    if (err.status === 401) { setOnline(true); showSignin(true); }
    else setOnline(false);
  }
}

/* ---------- sign in ---------- */
function showSignin(on) {
  const form = $("signin");
  if (on === !form.hidden) return;
  form.hidden = !on;
  $("boardBody").hidden = on;
  $("signOut").hidden = on || !KEY || EMBED;
  if (!on) return;
  board = null;
  $("msgStack").innerHTML = ""; delete $("msgStack").dataset.ids;
  // inside OD Tracker the key comes from its Station settings, so that is where to fix it
  $("signinSub").textContent = EMBED
    ? "This board needs a password. Go back and enter it in Station settings."
    : KEY ? "The board password has changed. Enter the new one." : "Enter the lab's board password.";
  $("signinRow").hidden = EMBED;
  if (!EMBED) $("pw").focus();
}

$("signin").addEventListener("submit", async e => {
  e.preventDefault();
  $("pwGo").disabled = true;
  try {
    const { key } = await api("/api/login", { password: $("pw").value });
    KEY = key;
    try { localStorage.setItem(KEY_STORE, key); } catch (err) { /* this visit only */ }
    $("pw").value = ""; $("pwErr").textContent = "";
    await refresh();
  } catch (err) {
    $("pwErr").textContent = err.status ? err.message : "Can't reach the board server.";
  }
  $("pwGo").disabled = false;
});

$("signOut").onclick = () => {
  KEY = "";
  try { localStorage.removeItem(KEY_STORE); } catch (e) { /* nothing kept */ }
  refresh();
};

function setOnline(on) {
  online = on;
  $("connDot").className = "dot " + (on ? "on" : "off");
  $("connText").textContent = on ? "Live" : "Can't reach the board server";
}

// every change is followed by a fresh read, so all screens agree within a poll
async function act(path, body, errEl) {
  try {
    await api(path, body);
    if (errEl) errEl.textContent = "";
    await refresh();
    return true;
  } catch (err) {
    if (errEl) errEl.textContent = err.message;
    return false;
  }
}

/* ---------- render ---------- */
function render() {
  if (!board) return;
  $("signOut").hidden = !KEY || EMBED;
  $("title").innerHTML = STATION
    ? `Station Board <span>· ${esc(STATION)}</span>` : "Station Board";

  const mine = board.stations.find(s => s.name === STATION);

  // this station: who's here, and the way on and off
  $("hereSec").hidden = !STATION;
  if (STATION) {
    const here = mine ? mine.people : [];
    $("here").innerHTML = (here.length
      ? here.map(p => `<span class="person-chip">${esc(p.name)}
          <span class="since">since ${clock(p.since)}</span>
          <button data-logoff="${esc(p.name)}">Log off</button></span>`).join("")
      : `<span class="nobody">Nobody is logged on at ${esc(STATION)}.</span>`)
      + `<div class="spacer"></div><button class="primary" id="logonBtn">Log on</button>`;
    $("logonBtn").onclick = openLogon;
    $("here").querySelectorAll("[data-logoff]").forEach(b => {
      b.onclick = () => act("/api/logoff", { person: b.dataset.logoff });
    });
  }

  // every station; this one first, since it is the one in front of you
  const list = board.stations.slice().sort((a, b) => (b.name === STATION) - (a.name === STATION));
  $("emptyBoard").hidden = list.length > 0;
  $("stations").innerHTML = list.map(s => `
    <div class="station ${s.name === STATION ? "mine" : ""}">
      <div class="st-head">
        <span class="dot ${s.online ? "on" : ""}" title="${s.online ? "Station is on" : "Station not heard from"}"></span>
        <span class="st-name">${esc(s.name)}</span>
        <span class="st-state">${s.name === STATION ? "this station" : s.online ? "" : "offline"}</span>
      </div>
      ${s.people.length ? s.people.map(p => `
        <div class="st-person">
          <span class="who"><b>${esc(p.name)}</b><small>here since ${clock(p.since)}</small></span>
          <button data-msg="${esc(p.name)}">Request</button>
        </div>`).join("") : `<div class="st-empty">Nobody here</div>`}
    </div>`).join("");
  $("stations").querySelectorAll("[data-msg]").forEach(b => { b.onclick = () => openMessage(b.dataset.msg); });

  renderMessages();
  if ($("logonDlg").open) renderLogonNames();
}

/* Incoming requests, upper right. Inside OD Tracker the parent page draws these
   (it is what fills the screen), so here they only show when standalone. */
function renderMessages() {
  const stack = $("msgStack");
  const msgs = EMBED || !board.messages ? [] : board.messages;
  const ids = msgs.map(m => m.id).join();
  if (stack.dataset.ids === ids) return;      // unchanged: leave the animation alone
  stack.dataset.ids = ids;
  stack.innerHTML = msgs.map(m => `
    <div class="msg" role="status">
      <div class="msg-body">
        <div><div class="msg-head"><span><b>${esc(m.from)}</b> → ${esc(m.to)}</span><time>${clock(m.at)}</time></div>
          <div class="msg-text">${esc(m.text)}</div></div>
        <div class="msg-actions"><button data-ack="${esc(m.id)}">Got it</button></div>
      </div>
    </div>`).join("");
  stack.querySelectorAll("[data-ack]").forEach(b => {
    b.onclick = () => act("/api/messages/ack", { id: b.dataset.ack });
  });
}

/* ---------- log on ---------- */
function openLogon() {
  removing = false;
  $("logonErr").textContent = "";
  $("newName").value = "";
  $("logonSub").textContent = `Tap your name to log on at ${STATION}.`;
  renderLogonNames();
  $("logonDlg").showModal();
}

function renderLogonNames() {
  const people = board ? board.people : [];
  $("editNames").textContent = removing ? "Done removing" : "Remove names…";
  $("logonNames").innerHTML = people.length ? people.map(p => {
    const where = p.station === STATION ? "already here"
                : p.station ? `at ${esc(p.station)} — moves here` : "";
    return `<button data-name="${esc(p.name)}" ${p.station === STATION && !removing ? "disabled" : ""}>
      ${removing ? `<span class="x">✕</span> ` : ""}${esc(p.name)}${where && !removing ? `<small>${where}</small>` : ""}
    </button>`;
  }).join("") : `<p class="dlg-sub" style="grid-column:1/-1;margin:0">No names yet — add yours below.</p>`;

  $("logonNames").querySelectorAll("[data-name]").forEach(b => {
    b.onclick = async () => {
      const name = b.dataset.name;
      if (removing) { await act("/api/people/remove", { name }, $("logonErr")); return; }
      if (await act("/api/logon", { person: name, station: STATION }, $("logonErr"))) $("logonDlg").close();
    };
  });
}

$("editNames").onclick = () => { removing = !removing; renderLogonNames(); };
$("logonCancel").onclick = () => $("logonDlg").close();
$("addName").onclick = async () => {
  const name = $("newName").value.trim();
  if (!name) { $("logonErr").textContent = "Type your name first."; $("newName").focus(); return; }
  if (await act("/api/logon", { person: name, station: STATION }, $("logonErr"))) $("logonDlg").close();
};
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") $("addName").click(); });

/* ---------- send a request ---------- */
function openMessage(to) {
  msgTo = to;
  const target = board.people.find(p => p.name === to);
  $("msgTitle").textContent = `Request for ${to}`;
  $("msgSub").textContent = target && target.station ? `It will appear on the ${target.station} screen.` : "";
  $("msgText").value = "";
  $("msgErr").textContent = "";

  // who is sending: whoever is logged on here, when that is one person
  const mine = board.stations.find(s => s.name === STATION);
  const here = mine ? mine.people.map(p => p.name).filter(n => n !== to) : [];
  msgFrom = here.length === 1 ? here[0] : null;
  renderFrom(here);

  $("presets").innerHTML = PRESETS.map(t => `<button type="button">${esc(t)}</button>`).join("");
  $("presets").querySelectorAll("button").forEach(b => { b.onclick = () => { $("msgText").value = b.textContent; }; });
  $("msgDlg").showModal();
}

function renderFrom(here) {
  // people at this station first: they are almost always the sender
  const names = board.people.map(p => p.name).filter(n => n !== msgTo)
    .sort((a, b) => here.includes(b) - here.includes(a));
  $("fromNames").innerHTML = names.length
    ? names.map(n => `<button type="button" data-from="${esc(n)}" class="${n === msgFrom ? "picked" : ""}">
        ${esc(n)}${here.includes(n) ? "<small>at this station</small>" : ""}</button>`).join("")
    : `<p class="dlg-sub" style="grid-column:1/-1;margin:0">Log on first so they know who's asking.</p>`;
  $("fromNames").querySelectorAll("[data-from]").forEach(b => {
    b.onclick = () => { msgFrom = b.dataset.from; renderFrom(here); };
  });
}

$("msgCancel").onclick = () => $("msgDlg").close();
$("msgSend").onclick = async () => {
  const text = $("msgText").value.trim();
  if (!msgFrom) { $("msgErr").textContent = "Pick who the request is from."; return; }
  if (!text) { $("msgErr").textContent = "Pick a message or write one."; return; }
  $("msgSend").disabled = true;
  const ok = await act("/api/messages", { from: msgFrom, to: msgTo, text }, $("msgErr"));
  $("msgSend").disabled = false;
  if (ok) $("msgDlg").close();
};

/* ---------- go ---------- */
refresh();
setInterval(refresh, POLL_MS);
// a screen woken from sleep should not wait out a whole poll to catch up
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
